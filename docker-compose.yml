# Chỉ dựng PostgreSQL 16 cho môi trường phát triển. Thông tin khớp .env.example.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm_dev_password
      POSTGRES_DB: smart_crm
    ports:
      - "5432:5432"
    volumes:
      - crm_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d smart_crm"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  crm_data:
